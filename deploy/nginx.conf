# 放入 /etc/nginx/conf.d/roundtable.conf（由 http 块包含）。
# 替换所有 api.example.com，并在配置生效前准备证书。
limit_req_zone $binary_remote_addr zone=roundtable_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=roundtable_login:10m rate=10r/m;
# 不记录 URL、查询、请求体、凭证或 IP。
log_format roundtable_safe '$time_iso8601 $request_method $status $request_time';

server {
    listen 80;
    server_name api.example.com;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://api.example.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.example.com;
    if ($host != api.example.com) { return 444; }
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    access_log /var/log/nginx/roundtable.access.log roundtable_safe;
    error_log /var/log/nginx/roundtable.error.log crit;
    limit_req_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location ~* ^/dev(?:/|$) { return 404; }
    location ~* ^/auth/wechat/?$ {
        limit_req zone=roundtable_login burst=5 nodelay;
        include /etc/nginx/snippets/roundtable-proxy.conf;
    }
    location / {
        limit_req zone=roundtable_api burst=20 nodelay;
        include /etc/nginx/snippets/roundtable-proxy.conf;
    }
}
